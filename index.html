<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depthsworn Council</title>
<meta name="description" content="Vote on what gets built next in Depthsworn, a dark-woods action RPG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
[hidden] { display: none !important }
img { max-width: 100% }

/* Layout: one narrow column; a tab per part of the game; each question is a card you answer in place. */
:root {
  --bg: #e7eae2; --panel: #f6f7f2; --sunk: #dde2d7; --ink: #1c231e; --muted: #5a675d; --line: #c6cdc1;
  --accent: #97461a; --accent-ink: #fff8f0; --ok: #2f7d4a;
  --d-art: #4f63c2; --d-world: #5b7a22; --d-animation: #b23a2e; --d-audio: #1f8678; --d-monsters: #7b4aa6; --d-combat: #b0561c; --d-loot: #8a6a1f; --d-story: #7a5a48; --d-ui: #4d5f6e;
  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111612; --panel: #19201b; --sunk: #0d110e; --ink: #e5e3d7; --muted: #95a094; --line: #2b352d;
  --accent: #e3893a; --accent-ink: #1b1209; --ok: #5cc27e;
  --d-art: #8c9cff; --d-world: #a2cb5a; --d-animation: #f07263; --d-audio: #4fc8b6; --d-monsters: #b98ce6; --d-combat: #ee9a55; --d-loot: #d9b55c; --d-story: #c9a48d; --d-ui: #9fb3c4;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111612; --panel: #19201b; --sunk: #0d110e; --ink: #e5e3d7; --muted: #95a094; --line: #2b352d;
  --accent: #e3893a; --accent-ink: #1b1209; --ok: #5cc27e;
  --d-art: #8c9cff; --d-world: #a2cb5a; --d-animation: #f07263; --d-audio: #4fc8b6; --d-monsters: #b98ce6; --d-combat: #ee9a55; --d-loot: #d9b55c; --d-story: #c9a48d; --d-ui: #9fb3c4;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 64px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em }
h1 { font-size: 2rem; line-height: 1.1 }
h2 { font-size: 1.35rem; line-height: 1.25 }
p { margin: 0 }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.small { font-size: .875rem }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700 }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }

header.top { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--line) }
header.top p { color: var(--muted); max-width: 54ch }

nav.tabs { display: flex; gap: 6px; margin: 16px 0 18px; flex-wrap: wrap; align-items: center }
nav.tabs a { --dc: var(--muted); text-decoration: none; color: var(--muted); padding: 6px 12px; font-size: .95rem; border-radius: 999px; font-weight: 700; border: 1px solid var(--line); display: inline-flex; gap: 7px; align-items: center }
nav.tabs a::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dc) }
nav.tabs a[aria-current="page"] { color: var(--dc); border-color: var(--dc); background: color-mix(in srgb, var(--dc) 10%, transparent) }
nav.tabs .count { font-family: var(--mono); font-size: .8rem; font-weight: 500 }
nav.tabs .spacer { flex: 1 }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px; font-weight: 500 }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.ghost { background: transparent }
.btn.sm { padding: 4px 9px; font-size: .875rem }
.btn:disabled { opacity: .5; cursor: not-allowed }

.list { display: grid; gap: 14px }
.q { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--dc); border-radius: 8px; padding: 16px; display: grid; gap: 12px }
.q .meta { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center }
.q > img, .choice img { border-radius: 6px; width: 100%; max-height: 360px; object-fit: cover; background: var(--sunk) }
.pill { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--sunk); color: var(--muted) }
.pill.open { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent) }
.pill.plan { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok) }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.choice { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; align-content: start; min-width: 0 }
.choice:hover:not(:disabled) { border-color: var(--muted) }
.choice.mine { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.choice:disabled { cursor: default }
.choice .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700 }
.choice img { max-height: 160px; aspect-ratio: 4/3 }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent) }

.answer { display: flex; gap: 8px; align-items: stretch }
.answer textarea { flex: 1; min-width: 0; min-height: 44px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical }
details.thoughts summary { cursor: pointer; color: var(--muted); font-size: .9rem }
.thought { padding: 8px 0; border-top: 1px solid var(--line); display: grid; gap: 2px }
.thought:first-of-type { border-top: 0 }
.thought p { white-space: pre-wrap; overflow-wrap: anywhere }
.plan { background: color-mix(in srgb, var(--ok) 8%, var(--bg)); border: 1px solid color-mix(in srgb, var(--ok) 35%, var(--line)); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px }
.plan p { white-space: pre-wrap }
.owner { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 10px; border-top: 1px dashed var(--line) }

.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 28px 20px; display: grid; gap: 10px; justify-items: start }
form.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px }
.field { display: grid; gap: 4px }
.field input[type=text], .field textarea, .field select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0 }
.field textarea { min-height: 70px; resize: vertical }
.optrow { display: flex; gap: 8px; align-items: center }
.optrow input[type=text] { flex: 1 }
.status-line { font-size: .9rem; color: var(--muted) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px) }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Depthsworn Council</h1>
    <p>Every part of the game has its own table. Pick an answer, say why, and the answers decide what gets built next. No account needed.</p>
  </header>
  <nav class="tabs" aria-label="Departments">
    <a href="#art" data-tab="art" style="--dc:var(--d-art)">Art <span class="count" id="c-art"></span></a>
    <a href="#world" data-tab="world" style="--dc:var(--d-world)">World <span class="count" id="c-world"></span></a>
    <a href="#animation" data-tab="animation" style="--dc:var(--d-animation)">Animation <span class="count" id="c-animation"></span></a>
    <a href="#audio" data-tab="audio" style="--dc:var(--d-audio)">Audio <span class="count" id="c-audio"></span></a>
    <a href="#monsters" data-tab="monsters" style="--dc:var(--d-monsters)">Monsters <span class="count" id="c-monsters"></span></a>
    <a href="#combat" data-tab="combat" style="--dc:var(--d-combat)">Combat <span class="count" id="c-combat"></span></a>
    <a href="#loot" data-tab="loot" style="--dc:var(--d-loot)">Loot <span class="count" id="c-loot"></span></a>
    <a href="#story" data-tab="story" style="--dc:var(--d-story)">Story <span class="count" id="c-story"></span></a>
    <a href="#ui" data-tab="ui" style="--dc:var(--d-ui)">Menus & UI <span class="count" id="c-ui"></span></a>
  </nav>
  <main id="view"><p class="status-line">Loading the council…</p></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
